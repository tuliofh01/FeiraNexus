andom_uuid()&#187;</text><line style="stroke:#181818;stroke-width:1;" x1="385.14" x2="788.8886" y1="376.1458" y2="376.1458"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="395.14" cy="391.1798" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="173.5573" x="404.14" y="395.1118">user_id : UUID FK --&gt; users</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="395.14" cy="410.2477" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="379.7486" x="404.14" y="414.1797">status : VARCHAR &#171;'pending' | 'paid' | 'failed' | 'canceled'&#187;</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="395.14" cy="429.3156" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="129.5275" x="404.14" y="433.2476">total_cents : BIGINT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="395.14" cy="448.3835" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="147.7134" x="404.14" y="452.3155">currency : VARCHAR(3)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="337.1046" x="404.14" y="471.3834">stripe_payment_intent_id : VARCHAR UNIQUE NULL</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="395.14" cy="486.5194" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="174.3553" x="404.14" y="490.4514">created_at : TIMESTAMPTZ</text></g><!--class order_items--><g class="entity" data-qualified-name="order_items" data-source-line="50" id="ent0006"><rect fill="#F1F1F1" height="143.3396" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="357.0287" x="764.5" y="587.0879"/><ellipse cx="899.2075" cy="603.0879" fill="#C2C2C2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M895.5669,609.5879 L895.5669,597.4473 L903.2231,597.4473 L903.2231,599.5723 L897.9419,599.5723 L897.9419,602.2285 L902.9575,602.2285 L902.9575,604.3535 L897.9419,604.3535 L897.9419,607.4629 L903.2231,607.4629 L903.2231,609.5879 L895.5669,609.5879 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79.1137" x="919.7075" y="608.5199">order_items</text><line style="stroke:#181818;stroke-width:0.5;" x1="765.5" x2="1120.5287" y1="619.0879" y2="619.0879"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="775.5" cy="634.1219" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="13.034" x="784.5" y="638.0539">id</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="209.4672" x="801.1739" y="638.0539">: UUID PK &#171;gen_random_uuid()&#187;</text><line style="stroke:#181818;stroke-width:1;" x1="765.5" x2="1120.5287" y1="646.1558" y2="646.1558"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="775.5" cy="661.1898" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="331.0287" x="784.5" y="665.1218">order_id : UUID FK --&gt; orders ON DELETE CASCADE</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="775.5" cy="680.2577" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.2812" x="784.5" y="684.1897">product_id : UUID FK --&gt; products</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="775.5" cy="699.3256" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="88.8297" x="784.5" y="703.2576">quantity : INT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="775.5" cy="718.3935" fill="#000000" rx="3" ry="3" style="stroke:#000000;stroke-width:1;"/></g><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="164.2893" x="784.5" y="722.3255">unit_price_cents : BIGINT</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="65" id="ent0012"><path d="M60.55,618.3379 L60.55,699.162 A0,0 0 0 0 60.55,699.162 L295.4782,699.162 A0,0 0 0 0 295.4782,699.162 L295.4782,628.3379 L285.4782,618.3379 L182.01,618.3379 L178.01,508.2779 L174.01,618.3379 L60.55,618.3379 A0,0 0 0 0 60.55,618.3379" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M285.4782,618.3379 L285.4782,628.3379 L295.4782,628.3379 L285.4782,618.3379" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.9282" x="66.55" y="637.2349">refresh_token_hash stores only the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="199.0562" x="66.55" y="654.9409">SHA-256 hex digest of the token.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.1802" x="66.55" y="672.647">Reuse of a revoked token triggers</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.0131" x="66.55" y="690.353">JobRevokeCompromisedUser.</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="72" id="ent0015"><path d="M461.65,627.1979 L461.65,690.316 A0,0 0 0 0 461.65,690.316 L712.3732,690.316 A0,0 0 0 0 712.3732,690.316 L712.3732,637.1979 L702.3732,627.1979 L591.01,627.1979 L587.01,499.0379 L583.01,627.1979 L461.65,627.1979 A0,0 0 0 0 461.65,627.1979" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M702.3732,627.1979 L702.3732,637.1979 L712.3732,637.1979 L702.3732,627.1979" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.9222" x="467.65" y="646.0949">stripe_payment_intent_id is UNIQUE</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.3812" x="467.65" y="663.8009">(idempotent webhook processing).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.7232" x="467.65" y="681.507">Written after PaymentIntent creation.</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="78" id="ent0018"><path d="M818.39,791.4279 L818.39,872.252 A0,0 0 0 0 818.39,872.252 L1067.6312,872.252 A0,0 0 0 0 1067.6312,872.252 L1067.6312,801.4279 L1057.6312,791.4279 L947.01,791.4279 L943.01,730.8179 L939.01,791.4279 L818.39,791.4279 A0,0 0 0 0 818.39,791.4279" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M1057.6312,791.4279 L1057.6312,801.4279 L1067.6312,801.4279 L1057.6312,791.4279" fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.5592" x="824.39" y="810.3249">unit_price_cents snapshots the price</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.2412" x="824.39" y="828.0309">at checkout time (immutable history).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.1152" x="824.39" y="845.737">DecrementProductStock uses</text><text fill="#000000" font-family="sans-serif" font-size=
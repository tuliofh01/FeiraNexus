name: fn_webserver

services:
  postgres:
    image: postgres:17-alpine
    container_name: fn_webserver-postgres-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: feiranexus
      POSTGRES_PASSWORD: feiranexus_dev_pass
      POSTGRES_DB: feiranexus_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feiranexus -d feiranexus_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
